<!DOCTYPE html>
<html lang="hr"
>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablice</title>
    <link rel="stylesheet" href="still.css">
</head>

<body>
    <h5><a href="index.html" >Vrati na početnu</a></h5>
    Ako želiš saznati sve o tablicama otvori <a href="vazno_o_tablicama.pdf" target="_blank"> pdf</a>
    <h1>Jednostavna tablica</h1>
    <table border="1" width=100% cellspadding="10px">
        <tr>
            <th colspan="5">Dani u tjednu</th>
        </tr>
        <tr>
            <td colspan="2">Ponedjeljak</td>
            
            <td rowspan="2">Srijeda</td>
            <td>Četvrtak</td>
            <td>Petak</td>
        </tr>
        <tr>
            <td>Ponedjeljak</td>
            <td>Utorak</td>
            <td>Četvrtak</td>
            <td>Petak</td>
        </tr>
    </table>

    <table border="1" cellspadding="10px">

        <tr>
            <td></td>
            <td>1.stupac</td>
            <td>2.stupac</td>
            <td>3.stupac</td>
            <td>4.stupac</td>
        </tr>
        <tr>
            <td>1.red</td>
            <td rowspan="3" bgcolor="orange"></td>
            <td rowspan="2" bgcolor="green"></td>
            <td>&nbsp;</td>
            <td bgcolor="red">&nbsp;</td>
        </tr>
        <tr>
            <td>2.red</td>
            <td colspan="2" bgcolor="yellow">&nbsp;</td>
        </tr>
        <tr>
            <td>3.red</td>
            <td colspan="3" bgcolor="purple">&nbsp;</td>
        </tr>
        <caption align="bottom">Ovo je opis tablice</caption>
    </table>

    
</body>
</html>
